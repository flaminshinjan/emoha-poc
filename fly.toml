app = "emoha-care-advisor"
primary_region = "bom"

[build]

[env]
  SERVER_HOST = "0.0.0.0"
  SERVER_PORT = "8080"
  LOG_LEVEL = "INFO"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep at least one machine warm so Bland webhooks and incoming voice
  # sessions don't pay a cold-start penalty. Set min_machines_running = 0
  # if you'd rather minimise idle cost.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2
